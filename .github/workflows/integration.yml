# Integration gate for the SquadRules Helm charts.
#
# Mirrors the check-name mechanism of SquadRules/mcp's integration.yml: real
# validation jobs plus a final gate job whose `name:` is the exact required
# status-check context ("Integration workflow passed") that `needs:` the workers.
# Branch protection on charts#main can then require that single context.
#
# Jobs (charts-appropriate content):
#   helm-lint      — helm lint --strict on charts/mcp (same strictness as chart-release).
#   helm-template  — render sanity check: the chart templates render to valid, non-empty manifests.
#   helm-unittest  — helm-unittest over the chart's existing tests/ fixtures.
#   integration-pass — merge gate; the reported context.
#
# Helm is pinned to v4.0.5 to match .github/workflows/chart-release.yml so a green
# gate implies the release lint/publish path sees the same result.
name: Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: charts/mcp
  HELM_VERSION: v4.0.5

jobs:
  product-identity:
    name: Product identity check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reject obsolete product identifiers
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei 'k[a]iros'; then
            echo "::error::Obsolete product identifier found in a tracked path"
            exit 1
          fi
          if git grep -In -i 'k[a]iros' -- .; then
            echo "::error::Obsolete product identifier found in a tracked file"
            exit 1
          fi
          echo "Product identity check passed."

  helm-lint:
    name: Helm lint (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add dependency repositories
        run: |
          set -euo pipefail
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Lint chart (strict)
        run: helm lint "$CHART_DIR" --strict

  helm-template:
    name: Helm template render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add dependency repositories
        run: |
          set -euo pipefail
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Render chart (helm template)
        run: |
          set -euo pipefail
          helm template squadrules "$CHART_DIR" > render.yaml
          echo "Rendered $(wc -l < render.yaml) lines."

      - name: Render sanity check
        run: |
          set -euo pipefail
          test -s render.yaml || { echo "::error::helm template produced empty output"; exit 1; }
          python3 - <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open("render.yaml")) if d]
          if not docs:
              print("::error::no manifests rendered"); sys.exit(1)
          kinds = sorted({d.get("kind") for d in docs if d.get("kind")})
          print(f"Rendered {len(docs)} manifests; kinds: {kinds}")
          core = {"Deployment", "StatefulSet", "Service", "ConfigMap", "ServiceAccount"}
          if not (core & set(kinds)):
              print(f"::error::no core workload rendered: {kinds}"); sys.exit(1)
          PY

  helm-unittest:
    name: Helm unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest plugin
        # Helm v4 enforces plugin provenance verification; the upstream plugin
        # source does not publish signatures, so verification is skipped
        # explicitly (same as local dev usage).
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest.git

      - name: Add dependency repositories
        run: |
          set -euo pipefail
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Run chart unit tests
        run: helm unittest "$CHART_DIR"

  chart-package:
    name: Helm package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add dependency repositories
        run: |
          set -euo pipefail
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Package chart with locked dependencies
        run: |
          set -euo pipefail
          helm dependency build "$CHART_DIR"
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist
          test "$(find dist -maxdepth 1 -name 'mcp-*.tgz' -type f | wc -l)" -eq 1

  # Merge gate: reported context is the job `name:` below. `needs:` every worker
  # job; `if: always()` so it runs even when a worker fails, then asserts results.
  integration-pass:
    name: Integration workflow passed
    needs: [product-identity, helm-lint, helm-template, helm-unittest, chart-package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs
        env:
          HELM_LINT: ${{ needs.helm-lint.result }}
          HELM_TEMPLATE: ${{ needs.helm-template.result }}
          HELM_UNITTEST: ${{ needs.helm-unittest.result }}
          CHART_PACKAGE: ${{ needs.chart-package.result }}
          PRODUCT_IDENTITY: ${{ needs.product-identity.result }}
        run: |
          set -euo pipefail
          echo "helm-lint=$HELM_LINT helm-template=$HELM_TEMPLATE helm-unittest=$HELM_UNITTEST"
          test "$HELM_LINT" = "success"
          test "$HELM_TEMPLATE" = "success"
          test "$HELM_UNITTEST" = "success"
          test "$CHART_PACKAGE" = "success"
          test "$PRODUCT_IDENTITY" = "success"
          echo "All integration jobs passed."
