name: Chart Release

on:
  push:
    branches: [main]
    paths: ['charts/mcp/**']
  repository_dispatch:
    types: [chart-update]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Lint chart
        run: helm lint charts/mcp --strict

      - name: Package chart
        run: |
          CHART_VERSION=$(grep '^version:' charts/mcp/Chart.yaml | awk '{print $2}')
          helm package charts/mcp --destination dist
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart
        run: helm push "dist/mcp-${chart_version}.tgz" oci://ghcr.io/squadrules/charts
