name: chart-release

on:
  push:
    branches:
      - main
    paths:
      - "charts/mcp/**"
  repository_dispatch:
    types:
      - chart-update
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  CHART_DIR: charts/mcp
  OCI_REGISTRY: ghcr.io
  OCI_TARGET: oci://ghcr.io/squadrules/charts

jobs:
  release:
    name: Lint, package and publish chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.5

      - name: Add dependency repositories
        run: |
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Lint chart
        run: helm lint "$CHART_DIR" --strict

      - name: Package chart
        run: helm package "$CHART_DIR" --destination dist

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$OCI_REGISTRY" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push chart to OCI registry
        run: |
          shopt -s nullglob
          packages=(dist/*.tgz)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No packaged chart found in dist/" >&2
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            echo "Pushing $pkg to $OCI_TARGET"
            helm push "$pkg" "$OCI_TARGET"
          done
