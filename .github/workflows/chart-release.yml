# Only a version change triggers publishing. Packaging other file edits with an
# unchanged chart version would attempt to overwrite an immutable OCI release.
name: Chart Release

on:
  push:
    branches: [main]
    paths:
      - charts/mcp/Chart.yaml
  repository_dispatch:
    types: [chart-update]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chart-publish-main
  cancel-in-progress: false

env:
  CHART_DIR: charts/mcp
  OCI_TARGET: oci://ghcr.io/squadrules/charts

jobs:
  release:
    name: Validate and publish OCI chart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.5

      - name: Add dependency repositories
        run: |
          set -euo pipefail
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Build dependencies and validate
        run: |
          set -euo pipefail
          helm dependency build "$CHART_DIR"
          helm lint "$CHART_DIR" --strict
          helm template squadrules "$CHART_DIR" --namespace squadrules > /tmp/squadrules-rendered.yaml
          test -s /tmp/squadrules-rendered.yaml

      - name: Install chart unit test plugin
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest.git

      - name: Run chart unit tests
        run: helm unittest "$CHART_DIR"

      - name: Package chart
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Ensure version has not been published
        run: |
          set -euo pipefail
          version="$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2; exit}')"
          test -n "$version"
          if helm show chart "$OCI_TARGET/mcp" --version "$version" > /dev/null 2>&1; then
            echo "::error::OCI chart version $version already exists. Bump charts/mcp/Chart.yaml instead of overwriting."
            exit 1
          fi
          echo "Publishing mcp chart $version"

      - name: Publish chart to OCI
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/mcp-*.tgz)
          test "${#packages[@]}" -eq 1
          helm push "${packages[0]}" "$OCI_TARGET"
