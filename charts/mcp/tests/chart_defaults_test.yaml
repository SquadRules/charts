# helm-unittest — https://github.com/helm-unittest/helm-unittest
---
suite: credentials generator RBAC
templates:
  - credentials-generator-rbac.yaml
tests:
  - it: renders hook ServiceAccount Role and RoleBinding when auto-generating credentials
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - isKind:
          of: Role
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 2
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME-credentials-generator
        documentIndex: 0
---
suite: Gateway resource
templates:
  - gateway.yaml
tests:
  - it: renders Gateway when createGateway and explicit gatewayClassName are set
    set:
      gateway.enabled: true
      gateway.createGateway: true
      gateway.hostname: "squadrules.example.com"
      gateway.gatewayName: "squadrules-gateway"
      gateway.gatewayClassName: "ngrok"
      gateway.tls.certManager.enabled: false
    asserts:
      - isKind:
          of: Gateway
      - equal:
          path: spec.gatewayClassName
          value: ngrok
  - it: does not render Gateway when gatewayClassName is empty and no cluster GatewayClass
    set:
      gateway.enabled: true
      gateway.createGateway: true
      gateway.hostname: "squadrules.example.com"
    asserts:
      - hasDocuments:
          count: 0
  - it: renders infrastructure annotations when set
    set:
      gateway.enabled: true
      gateway.createGateway: true
      gateway.hostname: "squadrules.example.com"
      gateway.gatewayClassName: "istio"
      gateway.infrastructureAnnotations:
        proxy.istio.io/config: '{"seccompProfile":{"type":"RuntimeDefault"}}'
    asserts:
      - isSubset:
          path: spec.infrastructure.annotations
          content:
            proxy.istio.io/config: '{"seccompProfile":{"type":"RuntimeDefault"}}'
---
suite: MCP HTTPRoute
templates:
  - httproute-mcp.yaml
tests:
  - it: renders HTTPRoute when gateway class is set
    set:
      gateway.enabled: true
      gateway.hostname: "squadrules.example.com"
      gateway.gatewayClassName: "ngrok"
      app.enabled: true
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: squadrules-gateway
  - it: renders CORS ResponseHeaderModifier when cors.enabled
    set:
      gateway.enabled: true
      gateway.hostname: "squadrules.example.com"
      gateway.gatewayClassName: "ngrok"
      gateway.routes.mcp.cors.enabled: true
      app.enabled: true
    asserts:
      - isKind:
          of: HTTPRoute
      - contains:
          path: spec.rules[0].filters
          content:
            type: ResponseHeaderModifier
            responseHeaderModifier:
              add:
                - name: Access-Control-Allow-Origin
                  value: "*"
                - name: Access-Control-Allow-Methods
                  value: "POST, OPTIONS"
                - name: Access-Control-Allow-Headers
                  value: "Content-Type, Authorization, MCP-Protocol-Version"
                - name: Access-Control-Max-Age
                  value: "86400"
  - it: does not render CORS filter when cors disabled
    set:
      gateway.enabled: true
      gateway.hostname: "squadrules.example.com"
      gateway.gatewayClassName: "ngrok"
      app.enabled: true
    asserts:
      - isKind:
          of: HTTPRoute
      - notContains:
          path: spec.rules[0].filters
          content:
            type: ResponseHeaderModifier
---
suite: app Service
templates:
  - mcp-service.yaml
tests:
  - it: renders Service when app is enabled
    set:
      app.enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 3000

---
suite: SquadRules release defaults
templates:
  - mcp-deployment.yaml
  - mcp-service.yaml
tests:
  - it: deploys the SquadRules MCP image and stable application label
    template: mcp-deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: squadrules-mcp
      - equal:
          path: spec.template.spec.containers[0].name
          value: squadrules-mcp
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^quay[.]io/squadrules/mcp:[0-9]+[.][0-9]+[.][0-9]+
  - it: exposes the branded app service
    template: mcp-service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: squadrules-mcp
---
suite: SquadRules metrics
templates:
  - prometheusrule.yaml
tests:
  - it: uses the metric name exposed by SquadRules MCP
    set:
      monitoring.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: squadrules_http_requests_total

  - it: exposes the branded app service
    template: mcp-service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: squadrules-mcp
---
suite: SquadRules metrics
templates:
  - prometheusrule.yaml
tests:
  - it: uses the metric name exposed by SquadRules MCP
    set:
      monitoring.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: squadrules_http_requests_total
---
suite: SquadRules OIDC realm
templates:
  - keycloak-realm-import.yaml
tests:
  - it: creates the branded realm with substituted public redirect URI
    set:
      keycloakInstance.enabled: true
      keycloakRealmImport.enabled: true
      keycloakRealmImport.publicBaseUrl: https://squadrules.example.com
    asserts:
      - isKind:
          of: KeycloakRealmImport
      - equal:
          path: spec.realm.realm
          value: squadrules
      - equal:
          path: spec.realm.clients[0].clientId
          value: squadrules-mcp
      - contains:
          path: spec.realm.clients[0].redirectUris
          content: https://squadrules.example.com/auth/callback
